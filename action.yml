name: 'Android Emulator Setup'
description: 'Sets up an Android SDK, creates an emulator, and starts it.'
inputs:
  api-level:
    description: 'The API level to use for the Android emulator.'
    required: true
    default: '35'

runs:
  using: 'composite'
  steps:
    - name: Enable KVM group permission for Linux runners
      if: runner.os == 'Linux'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
      shell: bash

    - name: Install Android SDK on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update > /dev/null 2>&1
        sudo apt-get install -y wget unzip > /dev/null 2>&1
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip  > /dev/null 2>&1
        mkdir -p $HOME/android-sdk/cmdline-tools  > /dev/null 2>&1
        unzip commandlinetools-linux-8512546_latest.zip -d $HOME/android-sdk/cmdline-tools  > /dev/null 2>&1
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/tools  > /dev/null 2>&1
      shell: bash

    - name: Install Android SDK on macOS
      if: runner.os == 'macOS'
      run: |
        brew update  > /dev/null 2>&1
        brew install wget unzip  > /dev/null 2>&1
        wget https://dl.google.com/android/repository/commandlinetools-mac-8512546_latest.zip  > /dev/null 2>&1
        mkdir -p $HOME/android-sdk/cmdline-tools   > /dev/null 2>&1
        unzip commandlinetools-mac-8512546_latest.zip -d $HOME/android-sdk/cmdline-tools   > /dev/null 2>&1
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/tools  > /dev/null 2>&1
      shell: bash

    - name: Set up environment variables
      run: |
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      shell: bash

    - name: Accept Android SDK licenses interactively
      run: yes | $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager --licenses  > /dev/null 2>&1 || true
      shell: bash

    - name: Install SDK images
      run: |
        $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-${{ inputs.api-level }}" \
          "build-tools;${{ inputs.api-level }}.0.0" \
          "system-images;android-${{ inputs.api-level }};google_apis;x86_64" \
          "emulator" > /dev/null 2>&1
      shell: bash

    - name: Create emulator
      run: |
        echo "no" | $HOME/android-sdk/cmdline-tools/tools/bin/avdmanager create avd -n emu -k "system-images;android-${{ inputs.api-level }};google_apis;x86_64" --device "pixel" > /dev/null 2>&1
      shell: bash

    - name: Config emulator
      run: |
          AVD_PATH="$HOME/.android/avd/emu.avd/config.ini"
          
          # Ensure AVD exists before modifying
          if [ -f "$AVD_PATH" ]; then
              echo "Modifying emulator config..."
              echo "hw.cpu.ncore=4" >> "$AVD_PATH"
              echo "hw.ramSize=4096" >> "$AVD_PATH"
              echo "hw.heapSize=512" >> "$AVD_PATH"
              echo "disk.dataPartition.size=6G" >> "$AVD_PATH"
              echo "hw.keyboard=yes" >> "$AVD_PATH"
          else
              echo "AVD not found! Skipping configuration."
              exit 1
          fi
    
          # Disable hardware acceleration on Linux (if needed)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
              echo "Disabling Linux hardware acceleration"
              echo "ANDROID_EMULATOR_OPTIONS=-accel off" >> $GITHUB_ENV
          fi
      shell: bash

    - name: Start Android emulator
      run: |
          nohup $HOME/android-sdk/emulator/emulator -port 5554 -avd emu -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
      shell: bash

     - name: Wait for Emulator to Boot
      run: |
        boot_completed=""
        while [ "$boot_completed" != "1" ]; do
          sleep 5
          boot_completed=$($ANDROID_HOME/platform-tools/adb -s emulator-5554 shell getprop sys.boot_completed || true)
          echo "Waiting for emulator to boot..."
        done
        echo "Emulator has booted!"
      shell: bash
    
    - name: Unlock Emulator
      run: |
        echo "Unlocking emulator..."
        $ANDROID_HOME/platform-tools/adb -s emulator-5554 shell input keyevent 82 || true
      shell: bash
    
    - name: Configure Emulator Settings
      run: |
        echo "Disabling Hidden API Policy Restrictions..."
        adb -P 5037 -s emulator-5554 shell settings delete global hidden_api_policy_pre_p_apps
        adb -P 5037 -s emulator-5554 shell settings delete global hidden_api_policy_p_apps
        adb -P 5037 -s emulator-5554 shell settings delete global hidden_api_policy
    
        echo "Disabling Animations..."
        adb -P 5037 -s emulator-5554 shell settings put global window_animation_scale 0
        adb -P 5037 -s emulator-5554 shell settings put global transition_animation_scale 0
        adb -P 5037 -s emulator-5554 shell settings put global animator_duration_scale 0
    
        echo "Configuration Completed."
      shell: bash

    - name: Check list devices
      run: |
          $ANDROID_HOME/platform-tools/adb devices
      shell: bash
